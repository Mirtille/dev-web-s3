
networks:
  s3.net:
    driver: bridge

services:
  php:
    build:
      context: build
      dockerfile: 8.5-cli.Dockerfile
    ports:
      - "8000:80"
    networks:
      - s3.net
    volumes :
      - ./code:/var/php
    working_dir: /var/php
    command: php -S 0.0.0.0:80

#############################
# mysql + adminer / can be replaced by mariadb
#############################
  mysql:
    image: 'mariadb:latest'
    command: '--default-authentication-plugin=mysql_native_password --character-set-server=utf8 --collation-server=utf8_general_ci'
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_USER_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
    ports:
      - '3306:3306'
    networks:
      s3.net:
        aliases:
          - db

  adminer:
     image: adminer
     ports:
       - "8080:8080"
     networks:
       - s3.net

  phpmyadmin:
     image: phpmyadmin
     ports:
       - "8088:80"
     networks:
       - s3.net
     environment:
       - PMA_ARBITRARY=1
